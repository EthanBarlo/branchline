<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:5173; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Jira · Branchline</title>
    <script type="module" src="./chrome.ts"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header aria-label="Jira browser controls">
      <div class="top">
        <button data-action="back" class="icon" disabled aria-label="Go back" title="Go back">
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m9 4-6 6 6 6M3 10h14" /></svg>
        </button>
        <button data-action="reload" class="icon" aria-label="Reload" title="Reload">
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M16 8a6.5 6.5 0 1 0 .1 4M16 3v5h-5" /></svg>
        </button>
        <div class="ticket-badge">
          <h1 id="ticket">Jira</h1>
          <button data-action="clear-ticket" class="icon" aria-label="Clear ticket" title="Clear ticket">
            <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m6 6 8 8M14 6l-8 8" /></svg>
          </button>
        </div>
        <span id="loading" role="status" aria-label="Loading Jira" hidden></span>
        <span id="origin">Opening Jira…</span>
        <button data-action="external" class="external">
          Open in browser
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M11 3h6v6m0-6-9 9M7 4H3v13h13v-4" /></svg>
        </button>
        <button
          data-action="menu"
          class="icon"
          aria-label="Jira browser options"
          title="Jira browser options"
          aria-haspopup="menu"
        >
          <svg aria-hidden="true" viewBox="0 0 20 20">
            <circle cx="4" cy="10" r=".8" />
            <circle cx="10" cy="10" r=".8" />
            <circle cx="16" cy="10" r=".8" />
          </svg>
        </button>
        <button data-action="close" class="icon" aria-label="Close Jira" title="Close Jira">
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15" /></svg>
        </button>
      </div>
      <span id="connection" hidden></span>
      <div class="status-row" aria-live="polite" hidden><p id="status"></p></div>
    </header>
  </body>
</html>
